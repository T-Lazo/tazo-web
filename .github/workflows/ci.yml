# Lint and type-check every pull request (and pushes to main).
# Vercel already builds each push, but its build doesn't run ESLint.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
